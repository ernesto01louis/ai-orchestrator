<!doctype html>
<html lang="en" data-theme="default">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>orchestrator · operator console</title>

    <!-- IBM Plex Sans + Mono — design tokens reference these by name. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!--
      Set the initial data-theme synchronously (before React mounts) to
      avoid a default-theme flash when localStorage says "personal".
      useTheme() takes over after hydration.
    -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("theme");
          if (t === "personal") document.documentElement.setAttribute("data-theme", "personal");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
