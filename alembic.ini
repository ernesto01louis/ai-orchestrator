# Alembic configuration for the AI Orchestrator (Phase 2.1).
#
# DSN is NOT set here — alembic/env.py loads .env directly so the
# migration runner doesn't drag the FastAPI dependency tree along.
# This means alembic upgrade can run on a stripped-down host (e.g. a
# CI service container that only has psycopg + alembic + sqlalchemy
# installed) without pulling Pydantic/FastAPI/Prefect at import time.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
sqlalchemy.url =


[post_write_hooks]


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
