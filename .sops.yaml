# SOPS encryption rules for the ai-orchestrator repo.
#
# The age public key below authorises encryption against the
# orchestrator LXC's keypair (generated by scripts/install_sops.sh).
# To onboard a second operator: add their age public key after a comma
# (sops supports multi-recipient encryption — each operator can decrypt
# with their own private key without sharing).
#
# PLACEHOLDER: the age field below must be replaced with the public
# key printed by ``scripts/install_sops.sh`` on first run. The string
# starts with ``age1`` and is ~62 chars long.
creation_rules:
  - path_regex: '^\.env\.sops$'
    age: REPLACE_WITH_ORCHESTRATOR_AGE_PUBKEY
