[project]
name = "ai-orchestrator"
version = "0.1.0"
description = "Autonomous AI research orchestrator — platform for campaigns, evidence, and reproducibility."
requires-python = ">=3.11"

[project.scripts]
orchestrator = "cli.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers -m 'not prefect_real and not postgres_real'"
markers = [
    "live: tests that hit the live orchestrator at http://127.0.0.1:8000 (requires the service to be running)",
    "inprocess: tests that import app.py in-process via TestClient",
    "prefect_real: requires a real Prefect 3 server reachable at $PREFECT_API_URL",
    "postgres_real: requires a real Postgres reachable at $POSTGRES_DSN (Phase 2.1)",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# Phase 0: lenient. Tighten over time.
select = ["E", "F", "W", "I"]
ignore = ["E501"]  # let formatter handle long lines

[tool.ruff.lint.per-file-ignores]
# Package __init__ files re-export public API; F401 is intentional.
"**/__init__.py" = ["F401", "I001"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
# Phase 0: only enforce strictness on freshly-extracted modules.
files = ["core", "llm", "notifications", "tools", "execution"]
