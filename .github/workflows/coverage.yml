name: coverage

# Coverage is split out from the main CI workflow because pytest-cov +
# Prefect's per-test temporary-server spin-up exhausts the GHA runner's
# memory budget (~7GB cap) under the full `--cov=...` instrumentation
# scope. Running coverage on PRs would block every merge for 20+ min
# until OOM-kill.
#
# Strategy:
# - Nightly cron at 03:00 UTC measures the full source surface on a
#   fresh runner. Slow runs are fine here; nobody waits on them.
# - workflow_dispatch lets the operator trigger an on-demand run
#   without waiting for the cron.
# - Result: a daily coverage.xml artifact + a coverage-summary commit
#   status so codecov / coveralls integration can grab the trend.
#
# Audit Section D.7. Initial gate at --cov-fail-under=40 over the
# *small* package scope only (the heavyweight orchestration / api /
# evidence / memory_pkg / execution / prefect_io packages stay out
# of coverage instrumentation until a parallel-coverage migration
# lands; see Phase 4+ backlog in ROADMAP).

on:
  schedule:
    - cron: "0 3 * * *"  # nightly 03:00 UTC
  workflow_dispatch: {}

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-eval.txt
          pip install pytest pytest-asyncio pytest-mock pytest-cov httpx
          pip install 'ai-orchestrator-client>=0.1.0a0,<0.2'

      - name: Run unit tests with coverage
        # Coverage scope is the *small* packages only (lightweight
        # primitives, gates, MCP, signing, manifest, CLI). Heavyweight
        # packages excluded — see comment at the top of this workflow.
        run: |
          pytest -q \
            --cov=core --cov=llm --cov=notifications --cov=tools \
            --cov=references_pkg --cov=agents --cov=manifest --cov=cli \
            --cov-report=term --cov-report=xml --cov-fail-under=40

      - name: Upload coverage XML artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 30

      # Codecov publishes the badge + trend graph linked from README.
      # Tokenless for OSS public repos. fail_ci_if_error=false keeps a
      # codecov outage from breaking the nightly job — the artifact
      # upload above is the local-of-record copy.
      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
          verbose: false
