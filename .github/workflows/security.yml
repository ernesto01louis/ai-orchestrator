name: Security scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# SECURITY.md "Defense layers" lists pip-audit as recommended; this wires it
# (plus bandit + gitleaks) into CI. bandit + gitleaks are BLOCKING — the
# baseline is clean: the one High is annotated `# nosec B602` at
# tools/__init__.py, and the by-design /tmp scratch paths are skipped (B108).
# pip-audit stays ADVISORY because two flagged CVEs (paramiko CVE-2026-44405,
# diskcache CVE-2025-69872) have no upstream fix yet.

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # gitleaks scans full git history

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install scanners + runtime deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-audit bandit

      - name: Dependency audit (pip-audit)
        continue-on-error: true
        run: pip-audit --progress-spinner off --desc

      - name: Static security lint (bandit)
        # Blocking. B108 (hardcoded /tmp) is skipped: the orchestrator's scratch,
        # sandbox, and server-log paths under /tmp are intentional on a
        # single-tenant LXC. The one High (subprocess shell=True) carries a
        # `# nosec B602` with rationale at tools/__init__.py.
        run: |
          bandit -ll --skip B108 -r \
            app.py gates.py mcp_server.py dream.py \
            core llm notifications tools execution memory_pkg \
            orchestration api references_pkg eval_pkg evidence manifest

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "true"
