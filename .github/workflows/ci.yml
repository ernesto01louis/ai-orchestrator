name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-mock httpx ruff mypy types-requests types-PyYAML

      - name: Lint (ruff)
        run: ruff check core llm notifications tools execution memory_pkg orchestration api references_pkg

      # mypy stays advisory: only the freshly-extracted modules are
      # strict-checked, and the broader codebase still has untyped corners.
      - name: Type-check (mypy)
        run: mypy core llm notifications tools execution || echo "mypy non-blocking in Phase 0"

      - name: Run in-process tests (no live orchestrator on CI)
        run: pytest tests/test_inprocess.py tests/test_campaigns.py -q

      - name: Show test summary
        if: always()
        run: pytest --collect-only -q

  prefect-integration:
    runs-on: ubuntu-latest
    services:
      prefect-server:
        image: prefecthq/prefect:3-latest
        # The base image ships only the CLI; explicitly start the server.
        # --host 0.0.0.0 is required so the service port is reachable from
        # the runner (GitHub service containers run in their own network
        # namespace but expose mapped ports on localhost).
        # Without this command: line the container starts but nothing listens
        # on 4200 — the healthcheck would never pass.
        command: "prefect server start --host 0.0.0.0"
        options: >-
          --health-cmd "python -c 'import urllib.request, sys; sys.exit(0 if urllib.request.urlopen(\"http://localhost:4200/api/health\").status == 200 else 1)'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 30s
        ports:
          - 4200:4200
    env:
      PREFECT_API_URL: http://localhost:4200/api
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-mock httpx

      - name: Wait for Prefect server
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:4200/api/health > /dev/null; then
              echo "Prefect server up after ${i}s"
              exit 0
            fi
            sleep 2
          done
          echo "Prefect server never became ready" >&2
          exit 1

      - name: Run prefect_real tests
        run: pytest -q -m prefect_real
