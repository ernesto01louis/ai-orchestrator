name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-mock httpx ruff mypy

      - name: Lint (ruff)
        run: ruff check core llm notifications tools execution memory_pkg orchestration api references_pkg

      # Type-checking is currently lenient; only enforced on the freshly-extracted core/llm/notifications/tools/execution modules.
      - name: Type-check (mypy)
        run: mypy core llm notifications tools execution || echo "mypy non-blocking in Phase 0"

      - name: Run characterization tests (in-process only — no live orchestrator on CI)
        run: pytest tests/test_inprocess.py -q
        env:
          # the live HTTP smoke tests skip themselves when /health is unreachable
          ORCHESTRATOR_URL: http://127.0.0.1:8000

      - name: Show test summary
        if: always()
        run: pytest --collect-only -q
