name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Repo-screening eval primitive lives in opt-in extras; install
          # here so the mock-based unit tests in tests/test_eval_scoring.py
          # can patch `deepeval.*` symbols.
          pip install -r requirements-eval.txt
          pip install pytest pytest-asyncio pytest-mock pytest-cov httpx ruff mypy types-requests types-PyYAML
          # Phase 3.4 — example consumer smoke tests load the SDK to
          # validate the public contract from the consumer's side. The
          # orchestrator never imports it at runtime; this is a
          # dev/test-only dep.
          pip install 'ai-orchestrator-client>=0.1.0a0,<0.2'

      - name: Lint (ruff)
        run: ruff check core llm notifications tools execution memory_pkg orchestration api references_pkg

      # mypy stays advisory: only the freshly-extracted modules are
      # strict-checked, and the broader codebase still has untyped corners.
      - name: Type-check (mypy)
        run: mypy core llm notifications tools execution || echo "mypy non-blocking in Phase 0"

      - name: Run unit tests with coverage gate (excludes prefect_real via addopts)
        # Coverage covers every platform package under measurement (skips
        # tests/, agents/, scripts/, examples/, eval_pkg/). --cov-fail-under
        # starts at 50% — well below the suite's real coverage — so the
        # initial gate ratchets *up* over time via PRs that raise it.
        # ROADMAP success criterion is ≥80%; we stair-step there rather
        # than landing one giant test-bomb PR. Audit Section D.7.
        run: |
          pytest -q \
            --cov=core --cov=llm --cov=notifications --cov=tools \
            --cov=execution --cov=orchestration --cov=api --cov=evidence \
            --cov=memory_pkg --cov=references_pkg --cov=agents \
            --cov=manifest --cov=prefect_io --cov=cli \
            --cov-report=term --cov-report=xml --cov-fail-under=50

      - name: Upload coverage XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: Show test summary
        if: always()
        run: pytest --collect-only -q

  prefect-integration:
    runs-on: ubuntu-latest
    env:
      PREFECT_API_URL: http://localhost:4200/api
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-mock httpx

      - name: Start Prefect server (background)
        run: |
          nohup prefect server start --host 0.0.0.0 > prefect-server.log 2>&1 &
          echo "Started Prefect server in background (PID $!)"

      - name: Wait for Prefect server
        run: |
          for i in $(seq 1 90); do
            if python -c "import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health', timeout=2)" 2>/dev/null; then
              echo "Prefect server up after ${i}s"
              exit 0
            fi
            sleep 2
          done
          echo "Prefect server never became ready" >&2
          echo "--- prefect-server.log tail ---" >&2
          tail -50 prefect-server.log >&2 || true
          exit 1

      - name: Run prefect_real tests
        run: pytest -q -m prefect_real

      - name: Show Prefect server log on failure
        if: failure()
        run: tail -200 prefect-server.log || true

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: orchestrator
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: orchestrator
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orchestrator"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_DSN: postgresql://orchestrator:testpass@localhost:5432/orchestrator
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-mock httpx

      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            if python -c "import psycopg; psycopg.connect('${POSTGRES_DSN}', connect_timeout=2).close()" 2>/dev/null; then
              echo "Postgres up after ${i}s"
              exit 0
            fi
            sleep 2
          done
          echo "Postgres never became ready" >&2
          exit 1

      - name: Apply Alembic migrations
        run: alembic upgrade head

      - name: Run postgres_real tests
        run: pytest -q -m postgres_real
