name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-mock httpx ruff mypy types-requests types-PyYAML

      - name: Lint (ruff)
        run: ruff check core llm notifications tools execution memory_pkg orchestration api references_pkg

      # mypy stays advisory: only the freshly-extracted modules are
      # strict-checked, and the broader codebase still has untyped corners.
      - name: Type-check (mypy)
        run: mypy core llm notifications tools execution || echo "mypy non-blocking in Phase 0"

      - name: Run unit tests (default suite excludes prefect_real via addopts)
        run: pytest -q

      - name: Show test summary
        if: always()
        run: pytest --collect-only -q

  prefect-integration:
    runs-on: ubuntu-latest
    env:
      PREFECT_API_URL: http://localhost:4200/api
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-mock httpx

      - name: Start Prefect server (background)
        run: |
          nohup prefect server start --host 0.0.0.0 > prefect-server.log 2>&1 &
          echo "Started Prefect server in background (PID $!)"

      - name: Wait for Prefect server
        run: |
          for i in $(seq 1 90); do
            if python -c "import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health', timeout=2)" 2>/dev/null; then
              echo "Prefect server up after ${i}s"
              exit 0
            fi
            sleep 2
          done
          echo "Prefect server never became ready" >&2
          echo "--- prefect-server.log tail ---" >&2
          tail -50 prefect-server.log >&2 || true
          exit 1

      - name: Run prefect_real tests
        run: pytest -q -m prefect_real

      - name: Show Prefect server log on failure
        if: failure()
        run: tail -200 prefect-server.log || true
